<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Asmaas Wunderland</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* -------------------------------------------
         * GRUND-LAYOUT (FIXIERT & STABIL)
         * ------------------------------------------- */
        html, body {
            height: 100%; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background-color: #000;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* -------------------------------------------
         * PRELOADER (100% BLICKDICHT)
         * ------------------------------------------- */
        #preloader {
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background-color: #000; 
            z-index: 9999; 
            display: flex;
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            color: #fff;
            transition: opacity 1s ease-in-out; 
        }

        #loading-bar-container {
            width: 280px;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.1);
            margin-top: 20px;
            border-radius: 10px;
            overflow: hidden;
        }

        #loading-bar {
            height: 100%;
            width: 0%;
            background-color: #8a2be2;
            transition: width 0.2s ease-out;
        }

        /* -------------------------------------------
         * WEBSITE FRAME (DAS BILD-GERÜST)
         * ------------------------------------------- */
        #website-frame {
            position: relative;
            height: 100vh; 
            width: 100vh; /* Quadratisch basierend auf Höhe */
            max-width: 100vw;
            overflow: hidden; 
            z-index: 5;
            opacity: 0; /* Startet unsichtbar */
            
            /* Startposition für Zoom */
            transform: scale(1.0);
            transform-origin: 50% 100%; 
            transition: opacity 2s ease-out, transform 4s ease-in-out; 
        }

        /* Endzustand nach dem Laden */
        #website-frame.final-zoom {
            opacity: 1;
            transform: scale(1.2); 
        }

        /* Verhindert Linien zwischen den Slices */
        .slice {
            position: absolute;
            display: block;
            margin: 0;
            padding: 0;
            /* Anti-Aliasing Fix */
            outline: 1px solid transparent; 
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        .link-slice {
            cursor: pointer;
            text-decoration: none;
        }

        .base-slice, .overlay-slice {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
        }

        /* Overlay Styles */
        .overlay-slice {
            position: absolute;
            top: 0; left: 0;
            opacity: 0;
            transition: opacity 4s ease-out, filter 0.2s ease-out;
            pointer-events: none;
        }

        .overlay-slice.glow {
            opacity: 1;
        }

        /* -------------------------------------------
         * GLOW FARBEN
         * ------------------------------------------- */
        [data-slice-id='Slice14'] .overlay-slice.glow { filter: drop-shadow(0 0 25px #00bfff); }
        [data-slice-id='Slice12'] .overlay-slice.glow { filter: drop-shadow(0 0 25px #8a2be2); }
        [data-slice-id='Slice11'] .overlay-slice.glow { filter: drop-shadow(0 0 30px #ff0096); }
        [data-slice-id='Slice24'] .overlay-slice.glow { filter: drop-shadow(0 0 20px #00ff00); }
        [data-slice-id='Slice15'] .overlay-slice.glow { filter: drop-shadow(0 0 20px #ffa500); }

        /* Goldene Rahmen-Vignette */
        #vignette-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
            background: radial-gradient(ellipse at center, transparent 80%, rgba(255, 215, 0, 0.1) 100%);
            transition: opacity 2s;
        }
    </style>
</head>
<body>

<audio id="sound-slice11" src="https://xanderfoxy.github.io/AsmaasWunderland/Sounds/musik.mp3" preload="auto"></audio>
<audio id="sound-slice12" src="https://xanderfoxy.github.io/AsmaasWunderland/Sounds/videos.mp3" preload="auto"></audio>
<audio id="sound-slice14" src="https://xanderfoxy.github.io/AsmaasWunderland/Sounds/slice14.mp3" preload="auto"></audio>
<audio id="sound-slice15" src="https://xanderfoxy.github.io/AsmaasWunderland/Sounds/bilder.mp3" preload="auto"></audio>
<audio id="sound-slice24" src="https://xanderfoxy.github.io/AsmaasWunderland/Sounds/spiele.mp3" preload="auto"></audio>

<div id="preloader">
    <div id="preloader-text">✨ Betritt Asmaas Wunderland...</div>
    <div id="loading-bar-container">
        <div id="loading-bar"></div>
    </div>
</div>

<div id="vignette-layer"></div>

<div id="website-frame">
    <img class="slice" src="https://xanderfoxy.github.io/AsmaasWunderland/Slices/Slice7.png" style="left: 0%; top: 0%; width: 33.4%; height: 28.4%;">
    <img class="slice" src="https://xanderfoxy.github.io/AsmaasWunderland/Slices/Slice1.jpg" style="left: 33.3%; top: 0%; width: 39.5%; height: 22.7%;">
    <img class="slice" src="https://xanderfoxy.github.io/AsmaasWunderland/Slices/Slice8.png" style="left: 72.7%; top: 0%; width: 27.3%; height: 28.4%;">
    
    <a href="https://xanderfoxy.github.io/AsmaasWunderland/videos" class="slice link-slice" data-slice-id="Slice12" style="left: 39.9%; top: 28.4%; width: 26.6%; height: 6.4%;">
        <img class="base-slice" src="https://xanderfoxy.github.io/AsmaasWunderland/Slices/Slice12.png">
        <img class="overlay-slice" src="https://xanderfoxy.github.io/AsmaasWunderland/Slices/Slice12Overlay.png">
    </a>

    <a href="javascript:void(0);" class="slice link-slice" data-slice-id="Slice14" style="left: 23.8%; top: 41%; width: 24%; height: 23.1%;">
        <img class="base-slice" src="https://xanderfoxy.github.io/AsmaasWunderland/Slices/Slice14.png">
        <img class="overlay-slice" src="https://xanderfoxy.github.io/AsmaasWunderland/Slices/Slice14Overlay.png">
    </a>

    </div>

<script>
    const frame = document.getElementById('website-frame');
    const loadingBar = document.getElementById('loading-bar');
    const preloader = document.getElementById('preloader');

    // 1. LADE-LOGIK
    function trackProgress() {
        const images = document.querySelectorAll('img');
        let loadedCount = 0;
        const total = images.length;

        if (total === 0) return finishLoading();

        images.forEach(img => {
            if (img.complete) {
                update();
            } else {
                img.addEventListener('load', update);
                img.addEventListener('error', update);
            }
        });

        function update() {
            loadedCount++;
            loadingBar.style.width = (loadedCount / total * 100) + '%';
            if (loadedCount === total) {
                setTimeout(finishLoading, 800);
            }
        }
    }

    function finishLoading() {
        preloader.style.opacity = '0';
        setTimeout(() => {
            preloader.style.display = 'none';
            frame.classList.add('final-zoom');
        }, 1000);
    }

    // 2. KLICK-LOGIK
    document.querySelectorAll('.link-slice').forEach(link => {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            const sliceId = this.getAttribute('data-slice-id');
            const overlay = this.querySelector('.overlay-slice');
            const targetUrl = this.href;

            // Sound abspielen
            const audio = document.getElementById('sound-' + sliceId.toLowerCase());
            if (audio) { audio.currentTime = 0; audio.play(); }

            // Glow aktivieren
            if (overlay) overlay.classList.add('glow');

            // Weiterleitung
            if (targetUrl !== "javascript:void(0);" && targetUrl !== "#") {
                setTimeout(() => {
                    frame.style.opacity = '0';
                    setTimeout(() => window.location.href = targetUrl, 1500);
                }, 200);
            } else {
                // Wenn nur Glow, dann nach Zeit wieder ausblenden
                setTimeout(() => overlay.classList.remove('glow'), 400);
            }
        });
    });

    // iPad "Zurück"-Fix
    window.addEventListener('pageshow', (event) => {
        if (event.persisted) {
            frame.classList.remove('final-zoom');
            frame.style.opacity = '1';
            setTimeout(() => frame.classList.add('final-zoom'), 100);
        }
    });

    window.onload = trackProgress;
</script>

</body>
</html>
