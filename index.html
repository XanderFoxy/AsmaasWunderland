    <style>
        html, body {
            height: 100%; 
            margin: 0; padding: 0; 
            overflow: hidden; 
            background-color: #000;
            font-family: sans-serif;
        }

        /* PRELOADER */
        #preloader {
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background-color: #000; z-index: 9999; 
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center;
            color: #fff; transition: opacity 1.5s ease-out; 
        }

        #loading-bar-container {
            width: 300px; height: 4px;
            background-color: rgba(255, 255, 255, 0.2);
            margin: 20px auto; border-radius: 2px; overflow: hidden;
        }

        #loading-bar {
            height: 100%; width: 0%;
            background-color: #8a2be2;
        }

        /* WEBSITE-FRAME: Deine exakten Positionswerte */
        .website-frame {
            position: absolute;
            height: 100dvh; width: 100dvh; 
            top: 0; left: 50%; 
            overflow: hidden; z-index: 5;
            transition: opacity 2.0s ease-out, transform 4.0s ease-in-out; 
            opacity: 1;
            transform-origin: 50% 50%; 
            transform: translateX(-50%) scale(1.0); 
        }
        
        /* Dein spezieller Zoom-Punkt */
        .website-frame.final-zoom {
            transform-origin: 57.840% 76.321%; 
            transform: translateX(-50%) scale(1.3403); 
        }
        
        .website-frame.fade-out { opacity: 0 !important; }

        /* SLICES: Fix gegen Kachellinien */
        .slice {
            position: absolute;
            display: block;
            margin: -0.1px; /* Minimaler Überlapp gegen Linien */
            transform: translateZ(0); /* Hardware-Beschleunigung */
        }
           
        .link-slice { text-decoration: none; cursor: pointer; }

        .base-slice, .overlay-slice { 
            display: block; width: 100%; height: 100%; object-fit: fill; 
        }
        
        .overlay-slice {
            position: absolute; top: 0; left: 0;
            opacity: 0;
            transition: opacity 4.0s ease-out, filter 0.15s ease-out; 
            pointer-events: none; 
        }
        
        .overlay-slice.glow { opacity: 1; }

        /* DEINE GLOW EFFEKTE */
        .link-slice[data-slice-id='Slice14'] .overlay-slice.glow { filter: drop-shadow(0 0 25px rgba(0, 191, 255, 1)); }
        .link-slice[data-slice-id='Slice12'] .overlay-slice.glow { filter: drop-shadow(0 0 25px rgba(138, 43, 226, 1)); }
        .link-slice[data-slice-id='Slice11'] .overlay-slice.glow { filter: drop-shadow(0 0 40px rgba(255, 0, 150, 1)); }
        .link-slice[data-slice-id='Slice24'] .overlay-slice.glow { filter: drop-shadow(0 0 20px rgba(0, 255, 0, 0.9)); }
        .link-slice[data-slice-id='Slice15'] .overlay-slice.glow { filter: drop-shadow(0 0 20px rgba(255, 165, 0, 0.9)); }

        #vignette-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
            background-image: radial-gradient(ellipse 200% 100% at center, transparent 95%, rgba(255, 223, 0, 0.1) 100%);
        }
    </style>

<script>
    const frame = document.getElementById('website-frame');
    const loadingBar = document.getElementById('loading-bar');
    const preloader = document.getElementById('preloader');

    function init() {
        const images = document.querySelectorAll('img');
        let loaded = 0;
        images.forEach(img => {
            if (img.complete) loaded++;
            else { img.onload = () => { loaded++; update(); }; img.onerror = () => { loaded++; update(); }; }
        });
        function update() { 
            loadingBar.style.width = (loaded / images.length * 100) + '%';
            if (loaded >= images.length) setTimeout(showSite, 800);
        }
        update();
    }

    function showSite() {
        preloader.style.opacity = '0';
        setTimeout(() => { preloader.style.display = 'none'; frame.classList.add('final-zoom'); }, 1500);
    }

    document.querySelectorAll('.link-slice').forEach(link => {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            const sliceId = this.getAttribute('data-slice-id');
            const overlay = this.querySelector('.overlay-slice');
            const audio = document.getElementById('sound-' + sliceId.toLowerCase());
            if (audio) { audio.currentTime = 0; audio.play(); }
            if (overlay) overlay.classList.add('glow');
            if (this.href.includes('http')) {
                setTimeout(() => { frame.classList.add('fade-out'); setTimeout(() => window.location.href = this.href, 2000); }, 200);
            } else { setTimeout(() => overlay.classList.remove('glow'), 4000); }
        });
    });

    // RESET BEIM ZURÜCKGEHEN
    window.addEventListener('pageshow', (event) => {
        document.querySelectorAll('.overlay-slice').forEach(el => el.classList.remove('glow'));
        frame.classList.remove('fade-out');
        frame.classList.add('final-zoom');
    });

    window.onload = init;
</script>
