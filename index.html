    <style>
        /* -------------------------------------------
         * GRUNDLAGEN
         * ------------------------------------------- */
        html, body {
            height: 100%; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background-color: #000;
            font-family: sans-serif;
            touch-action: pan-y;
        }

        /* -------------------------------------------
         * PRELOADER (Blickdicht & Zentriert)
         * ------------------------------------------- */
        #preloader {
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background-color: #000; 
            z-index: 9999; 
            display: flex;
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            color: #fff;
            transition: opacity 1.2s ease-in-out; 
        }

        #loading-bar-container {
            width: 300px;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.2);
            margin: 20px auto;
            border-radius: 2px;
            overflow: hidden;
        }

        #loading-bar {
            height: 100%;
            width: 0%;
            background-color: #8a2be2; /* Deine Lila Farbe */
            transition: width 0.1s linear;
        }

        /* -------------------------------------------
         * HAUPT-CONTAINER (ZOOM-FAHRT)
         * ------------------------------------------- */
        .website-frame {
            position: absolute;
            height: 100dvh; 
            width: 100dvh; 
            top: 0; 
            left: 50%; 
            overflow: hidden; 
            z-index: 5;
            opacity: 0; /* Startet unsichtbar für sanften Fade-in */
            
            transform-origin: 50% 50%; 
            transform: translateX(-50%) scale(1.0); 
            transition: opacity 2.0s ease-out, transform 4.0s ease-in-out; 
        }
        
        /* Zustand nach dem Laden */
        .website-frame.final-zoom {
            opacity: 1;
            transform: translateX(-50%) scale(1.3403); 
            /* Hier habe ich deinen exakten Scale-Wert beibehalten */
        }
        
        .website-frame.fade-out {
            opacity: 0 !important;
        }

        /* -------------------------------------------
         * SLICE OPTIMIERUNG (GEGEN LINIEN)
         * ------------------------------------------- */
        .slice {
            position: absolute;
            display: block;
            margin: -0.05%; /* Winziger Überlapp verhindert Lücken */
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            outline: 1px solid transparent;
        }
           
        .link-slice {
            text-decoration: none; 
            color: inherit;
        }

        .base-slice, .overlay-slice { 
            display: block; 
            width: 100%; 
            height: 100%; 
            object-fit: fill; 
        }
        
        .overlay-slice {
            position: absolute;
            top: 0; left: 0;
            opacity: 0;
            transition: opacity 4.0s ease-out, filter 0.15s ease-out; 
            pointer-events: none; 
        }
        
        .link-slice .overlay-slice.glow {
            opacity: 1; 
        }

        /* -------------------------------------------
         * DEINE GLOW EFFEKTE (Bezeichnungen beibehalten)
         * ------------------------------------------- */
        .link-slice[data-slice-id='Slice14'] .overlay-slice.glow {
            filter: drop-shadow(0 0 25px rgba(0, 191, 255, 1)) drop-shadow(0 0 50px rgba(0, 191, 255, 0.8));
        }
        .link-slice[data-slice-id='Slice12'] .overlay-slice.glow {
             filter: drop-shadow(0 0 25px rgba(138, 43, 226, 1)) drop-shadow(0 0 50px rgba(138, 43, 226, 0.8));
        }
        .link-slice[data-slice-id='Slice11'] .overlay-slice.glow {
             filter: drop-shadow(0 0 40px rgba(255, 0, 150, 1)) drop-shadow(0 0 80px rgba(255, 0, 150, 0.8));
        }
        .link-slice[data-slice-id='Slice24'] .overlay-slice.glow {
             filter: drop-shadow(0 0 20px rgba(0, 255, 0, 0.9)) drop-shadow(0 0 40px rgba(0, 255, 0, 0.6));
        }
        .link-slice[data-slice-id='Slice15'] .overlay-slice.glow {
             filter: drop-shadow(0 0 20px rgba(255, 165, 0, 0.9)) drop-shadow(0 0 40px rgba(255, 165, 0, 0.6));
        }

        /* Vignette */
        #vignette-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
            background-image: radial-gradient(ellipse 200% 100% at center, transparent 95%, rgba(255, 223, 0, 0.15) 100%);
        }

<script>
    const frame = document.getElementById('website-frame');
    const loadingBar = document.getElementById('loading-bar');
    const preloader = document.getElementById('preloader');

    // Bilder laden tracken
    function trackLoading() {
        const images = document.querySelectorAll('img');
        let loaded = 0;
        const total = images.length;

        images.forEach(img => {
            if (img.complete) {
                update();
            } else {
                img.onload = update;
                img.onerror = update;
            }
        });

        function update() {
            loaded++;
            loadingBar.style.width = (loaded / total * 100) + '%';
            if (loaded >= total) {
                setTimeout(startSite, 800);
            }
        }
    }

    function startSite() {
        preloader.style.opacity = '0';
        setTimeout(() => {
            preloader.style.display = 'none';
            frame.classList.add('final-zoom');
        }, 1200);
    }

    // Klick Handler
    document.querySelectorAll('.link-slice').forEach(link => {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            const sliceId = this.getAttribute('data-slice-id');
            const overlay = this.querySelector('.overlay-slice');
            const targetUrl = this.href;

            // Sound (deine Original-IDs)
            const audio = document.getElementById('sound-' + sliceId.toLowerCase());
            if (audio) { audio.currentTime = 0; audio.play(); }

            if (overlay) overlay.classList.add('glow');

            if (targetUrl.includes('http')) {
                setTimeout(() => {
                    frame.classList.add('fade-out');
                    setTimeout(() => window.location.href = targetUrl, 2000);
                }, 200);
            } else {
                setTimeout(() => overlay.classList.remove('glow'), 4000);
            }
        });
    });

    // iPad Fix
    window.addEventListener('pageshow', (event) => {
        if (event.persisted) {
            frame.classList.remove('fade-out');
            frame.classList.add('final-zoom');
        }
    });

    window.onload = trackLoading;
</script>
