<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webseite mit Preloader</title>
    <style>
        /* Verhindert das Scrollen, solange der Preloader aktiv ist */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; 
        }

        /* DER PRELOADER-CONTAINER */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000; /* Schwarzer Hintergrund */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999; /* Immer ganz oben */
            overflow: hidden; /* FIX: Keine Scrollbalken im Preloader */
            transition: opacity 0.6s ease-out;
        }

        /* DEIN ORIGINAL DESIGN (Schrift & Emoji) */
        /* Hier habe ich die ursprüngliche kleine Größe und den Stil beibehalten */
        .preloader-content {
            color: white;
            font-family: Arial, sans-serif; /* Hier ggf. deine Wunsch-Schriftart eintragen */
            font-size: 16px; /* Die ursprüngliche, kleine Größe */
            text-align: center;
            line-height: 1.5;
        }

        /* INHALT DER WEBSEITE (Wird erst nach Laden sichtbar) */
        #main-content {
            padding: 20px;
            display: block;
        }
    </style>
</head>
<body>

    <div id="preloader">
        <div class="preloader-content">
            ✨ Lädt... 🐾 
        </div>
    </div>

    <div id="main-content">
        <h1>Willkommen auf der Webseite</h1>
        <p>Der Inhalt wird nun korrekt angezeigt, sobald der Preloader verschwindet.</p>
    </div>

    <script>
        // Funktion zum Ausblenden des Preloaders
        function removePreloader() {
            const preloader = document.getElementById('preloader');
            if (preloader) {
                preloader.style.opacity = '0'; // Sanftes Ausfaden
                
                setTimeout(() => {
                    preloader.style.display = 'none'; // Ganz entfernen
                    document.body.style.overflow = 'auto'; // Scrollen wieder erlauben
                }, 600);
            }
        }

        // 1. Wenn die Seite vollständig geladen ist
        window.addEventListener('load', function() {
            // Eine kleine Verzögerung von 500ms, damit man das Design kurz sieht
            setTimeout(removePreloader, 500); 
        });

        // 2. Sicherheits-Timeout: Falls ein Element nicht lädt, 
        // verschwindet der Preloader nach spätestens 4 Sekunden von selbst.
        setTimeout(removePreloader, 4000);
    </script>

</body>
</html>
