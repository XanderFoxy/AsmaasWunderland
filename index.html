<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Asmaas Wunderland</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        html, body {
            height: 100%; 
            margin: 0; padding: 0; 
            overflow: hidden; 
            background-color: #000;
        }

        /* PRELOADER */
        #preloader {
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background-color: #000; z-index: 9999; 
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center;
            color: #fff; transition: opacity 1.2s ease-in-out; 
        }

        /* WEBSITE-FRAME: FIXIERTE POSITIONIERUNG */
        .website-frame {
            position: absolute;
            height: 100dvh; width: 100dvh; 
            top: 0; left: 50%; 
            overflow: hidden; 
            z-index: 5;
            opacity: 0; /* Startet unsichtbar */
            
            /* WICHTIG: Der Fokuspunkt ist von Anfang an fixiert */
            transform-origin: 57.840% 76.321%; 
            transform: translateX(-50%) scale(1.0); 
            
            /* Sanfter Übergang nur für Scale und Opacity */
            transition: opacity 2s ease-out, transform 4s ease-in-out; 
        }
        
        /* Endzustand nach dem Laden - Nur der Scale ändert sich */
        .website-frame.final-zoom {
            opacity: 1;
            transform: translateX(-50%) scale(1.3403); 
        }
        
        .website-frame.fade-out { opacity: 0 !important; }

        /* SLICES: DEIN LAYOUT */
        .slice {
            position: absolute;
            display: block;
            margin: -0.6px; /* Schließt Kachellinien durch minimale Überlappung */
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            outline: 1px solid transparent; /* Hilft gegen Aliasing-Kanten */
        }
           
        .link-slice { text-decoration: none; cursor: pointer; }
        .base-slice, .overlay-slice { display: block; width: 100%; height: 100%; object-fit: fill; }
        
        .overlay-slice {
            position: absolute; top: 0; left: 0;
            opacity: 0;
            transition: opacity 0.4s ease-out; /* Schnelleres Ansprechen beim Klick */
            pointer-events: none; 
        }
        
        /* Die Klasse für das Leuchten */
        .glow-active { opacity: 1 !important; }

        /* DEINE GLOW EFFEKTE */
        [data-slice-id='Slice14'] .overlay-slice { filter: drop-shadow(0 0 20px #00bfff); }
        [data-slice-id='Slice12'] .overlay-slice { filter: drop-shadow(0 0 20px #8a2be2); }
        [data-slice-id='Slice11'] .overlay-slice { filter: drop-shadow(0 0 30px #ff0096); }
        [data-slice-id='Slice24'] .overlay-slice { filter: drop-shadow(0 0 20px #00ff00); }
        [data-slice-id='Slice15'] .overlay-slice { filter: drop-shadow(0 0 20px #ffa500); }
    </style>
</head>
<body>

<div id="preloader">
    <div id="loading-bar-container" style="width:200px; height:2px; background:rgba(255,255,255,0.2);">
        <div id="loading-bar" style="width:0%; height:100%; background:#8a2be2;"></div>
    </div>
</div>

<div class="website-frame" id="website-frame">
    </div>

<script>
    const frame = document.getElementById('website-frame');
    const loadingBar = document.getElementById('loading-bar');

    // Ladevorgang
    function init() {
        const images = document.querySelectorAll('img');
        let loaded = 0;
        if(images.length === 0) { finish(); return; }
        images.forEach(img => {
            if (img.complete) { loaded++; } 
            else { img.onload = () => { loaded++; check(); }; img.onerror = () => { loaded++; check(); }; }
        });
        function check() {
            loadingBar.style.width = (loaded / images.length * 100) + '%';
            if (loaded >= images.length) finish();
        }
        check();
    }

    function finish() {
        setTimeout(() => {
            document.getElementById('preloader').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('preloader').style.display = 'none';
                frame.classList.add('final-zoom');
            }, 1200);
        }, 500);
    }

    // Klick & Glow Logik
    document.querySelectorAll('.link-slice').forEach(link => {
        link.addEventListener('click', function(e) {
            const overlay = this.querySelector('.overlay-slice');
            if (overlay) overlay.classList.add('glow-active');

            const sliceId = this.getAttribute('data-slice-id');
            const audio = document.getElementById('sound-' + (sliceId ? sliceId.toLowerCase() : ''));
            if (audio) { audio.currentTime = 0; audio.play(); }

            if (this.href.includes('http')) {
                // Bei echten Links: Warten für Sound/Glow, dann Fade-Out
                e.preventDefault();
                const target = this.href;
                setTimeout(() => {
                    frame.classList.add('fade-out');
                    setTimeout(() => { window.location.href = target; }, 1000);
                }, 400);
            }
        });
    });

    // Reset beim Zurückkehren (Browser-Back)
    window.addEventListener('pageshow', (event) => {
        // 1. Alle Leuchteffekte aus
        document.querySelectorAll('.overlay-slice').forEach(el => {
            el.classList.remove('glow-active');
        });
        // 2. Sichtbarkeit wiederherstellen
        frame.classList.remove('fade-out');
        // 3. Zoom-Position halten (ohne erneute Animation)
        frame.style.transition = 'none';
        frame.classList.add('final-zoom');
        // Transition nach kurzem Moment wieder aktivieren für spätere Klicks
        setTimeout(() => { frame.style.transition = ''; }, 100);
    });

    window.onload = init;
</script>
</body>
</html>
